[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eville"
version = "0.1.0"
description = "Anytime-valid one-sample t-tests with extended Ville calibration"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Debolina Paul", email = "debolina.paul@stats.ox.ac.uk"},
  {name = "Patrick Rebeschini", email = "patrick.rebeschini@stats.ox.ac.uk"},
  {name = "François Caron", email = "francois.caron@stats.ox.ac.uk"},
]
keywords = ["statistics", "t-test", "anytime-valid", "e-values", "sequential-testing"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "pandas>=2.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "build>=1.2"]

[project.urls]
Repository = "https://github.com/DebolinaPaul/Robust_anytime_valid_t_test"
Issues = "https://github.com/DebolinaPaul/Robust_anytime_valid_t_test/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eville = ["data/*.csv.gz", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
